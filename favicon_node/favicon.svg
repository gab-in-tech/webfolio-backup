<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: matches the site's card surface color and corner radius language -->
  <rect width="64" height="64" rx="14" fill="#1e1f20"/>

  <!-- The mark: a straight line connecting three nodes that grow in size —
       small and uncertain, resolving into one clear, solid point.
       Same idea as the homepage tagline, rendered as a shape instead of a sentence. -->
  <line x1="18" y1="46" x2="48" y2="18" stroke="#e2e2e0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="18" cy="46" r="4" fill="#e2e2e0"/>
  <circle cx="32" cy="32" r="6" fill="#e2e2e0"/>
  <circle cx="48" cy="18" r="8" fill="#e2e2e0"/>
</svg>
